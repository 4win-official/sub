name: Daily Xray Config Tester

on:
  schedule:
    - cron: '0 0 * * *' # هر روز نیمه‌شب UTC (۳:۳۰ بامداد ایران)
  workflow_dispatch: # اجرای دستی

permissions:
  contents: write

jobs:
  test-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xray-knife
        run: |
          set -e
          wget -q https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip
          unzip -o -q Xray-knife-linux-64.zip
          BINARY_PATH=$(find . -name "xray-knife" -type f | head -n 1)
          if [ -z "$BINARY_PATH" ]; then echo "❌ فایل اجرایی پیدا نشد!"; exit 1; fi
          chmod +x "$BINARY_PATH"
          sudo mv "$BINARY_PATH" /usr/local/bin/xray-knife
          xray-knife --version

      - name: Add subscriptions
        run: |
          xray-knife subs add --url "https://raw.githubusercontent.com/hamedp-71/Sub_Checker_Creator/refs/heads/main/final.txt" --remark "hamedp"
          xray-knife subs add --url "https://raw.githubusercontent.com/ShadowException/VPN/refs/heads/main/configs/VPN-cat" --remark "ShadowVPN"
          xray-knife subs add --url "https://raw.githubusercontent.com/4win-official/sub/refs/heads/main/config.txt" --remark "4win"

      - name: Fetch all configs
        run: |
          xray-knife subs fetch --all
          echo "📥 تعداد کانفیگ دریافت‌شده: $(wc -l < configs.txt)"

      - name: Test configs and filter top 200
        id: test_step
        run: |
          # اجرای تست (با || true تا در صورت صفر بودن نتایج، ورک‌فلو کرش نکند)
          xray-knife http -f configs.txt -o tested_configs.txt || true
          
          # شمارش کانفیگ‌های سالم (فقط خطوطی که حاوی :// هستند)
          HEALTHY_COUNT=$(grep -c '://' tested_configs.txt || true)
          echo "✅ تعداد کانفیگ سالم تست‌شده: $HEALTHY_COUNT"
          
          # بررسی شرط کمتر از ۵ بودن
          if [ "$HEALTHY_COUNT" -lt 5 ]; then
            echo "⚠️ تعداد کانفیگ‌های سالم کمتر از ۵ عدد است. عملیات پوش لغو شد."
            echo "skip_push=true" >> "$GITHUB_OUTPUT"
          else
            # استخراج ۲۰۰ مورد برتر (چون خروجی از قبل بر اساس سرعت مرتب شده است)
            head -n 200 tested_configs.txt > config.txt
            echo "🎯 تعداد نهایی کانفیگ‌های برتر ذخیره‌شده: $(wc -l < config.txt)"
            echo "skip_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push results
        if: steps.test_step.outputs.skip_push == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.txt
          if git diff --cached --quiet; then
            echo "⚠️ فایل config.txt تغییری نکرده است."
          else
            git commit -m "Update top 200 working Xray configs [skip ci]"
            git push
            echo "✅ فایل config.txt با موفقیت به‌روزرسانی شد."
          fi
